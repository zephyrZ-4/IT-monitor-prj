name: cluster-monitor

services:
  db:
    image: cluster-monitor/postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: cluster_monitor
      POSTGRES_USER: cluster
      POSTGRES_PASSWORD: ${DB_PASSWORD:?请在 .env 中设置 DB_PASSWORD}
    volumes:
      - cluster_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cluster -d cluster_monitor"]
      interval: 5s
      timeout: 3s
      retries: 20
  web:
    image: cluster-monitor:0.2.0
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_USER: cluster
      DB_NAME: cluster_monitor
      DB_PASSWORD: ${DB_PASSWORD:?请在 .env 中设置 DB_PASSWORD}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?请在 .env 中设置 ADMIN_PASSWORD}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    ports:
      - "${WEB_PORT:-3000}:3000"
volumes:
  cluster_db:
